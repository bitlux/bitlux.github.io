<html>

<head>
  <title>dict regex</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 200%;
    }

    input {
      width: 100%;
      font-size: 200%;
    }

    .outer {
      width: 70%;
      margin: auto;
      padding-top: 1em;
    }

    #output {
      white-space: pre-line;
      width: 75%;
      margin: 1em auto;
      line-height: 1.2;
      font-size: 150%;
    }

    button {
      margin: .2em;
      padding: 5px 15px;
      font-size: 2em;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const output = document.getElementById("output");
      let allWords = [];
      let input = document.querySelector("input");

      // match regex based on input
      input.addEventListener("input", function (event) {
        output.textContent = "";

        const input = event.target.value.toLowerCase();
        if (input.length < 4) {
          return;
        }

        let matches = [];

        try {
          const re = new RegExp(input);

          for (const word of allWords) {
            if (matches.length > 100) {
              break;
            }
            if (re.test(word)) {
              matches.push(word);
              console.log(word);
            }
          }
        }
        catch (error) { }
        finally {
          output.textContent = matches.join("\n");
        }
      });

      // buttons
      const map = new Map();
      map.set("caret", "^");
      map.set("dollar", "$");
      map.set("lbrace", "{");
      map.set("rbrace", "}");
      map.set("lbracket", "[");
      map.set("rbracket", "]");
      for (const [id, value] of map) {
        let button = document.querySelector("#" + id);
        button.addEventListener('click', () => {
          input.value += value;
        });
      }

      // fetch dictionary
      fetch('https://raw.githubusercontent.com/bitlux/caches/refs/heads/master/lib/data/wordlist-20210729.txt')
        .then(response => response.text())
        .then(text => {
          allWords = text.split("\n");
         console.log("loaded", allWords.length, "words");
        })
        .catch(error => console.error('Error:', error));
    });
  </script>
</head>

<body>
  <div class="outer">
    <input type="text" id="regex">
    <button id="caret">^</button>
    <button id="dollar">$</button>
    <button id="star">*</button>
    <button id="lbrace">{</button>
    <button id="rbrace">}</button>
    <button id="lbracket">[</button>
    <button id="rbracket">]</button>
    <div id="output"></div>
  </div>
</body>

</html>
